# ============================================================

- id: EVID-001
  category: evidence-access
  critical: false
  description: Tier A + page 官方确认已完结 → serialization-status = completed + CONFIRMED
  request:
    prompt: "排雷《灰塔纪事》"
  runtime:
    base_mode: FULL_SCAN
    spoiler_level: light
    detail_level: normal
    preferences: null
  research_state:
    identity:
      title: "灰塔纪事"
      author: "林川"
      confidence: HIGH
    evidence:
      - id: E001
        dimension: serialization-status
        tier: A
        access_mode: page
        supports: SUPPORT
        summary: "官方作品页明确标注已完结。"
  expected:
    must:
      - "serialization-status = completed"
      - "confidence = CONFIRMED"
      - "该事实已足够确认，不必再找论坛重复确认"
    must_not:
      - "降低为 WEAK / UNKNOWN"
  reason: source-policy §5 + playbook §10（Tier A page 直接确认简单官方事实 → CONFIRMED，够用即停）。

- id: EVID-002
  category: evidence-access
  critical: true
  description: 搜索摘要“似乎为后宫” → 禁止 harem = CONFIRMED
  request:
    prompt: "《灰塔纪事》后宫吗？"
  runtime:
    base_mode: SPECIFIC_RISK
    spoiler_level: none
    detail_level: normal
    preferences: null
    target: romance-structure
  research_state:
    identity:
      title: "灰塔纪事"
      author: "林川"
      confidence: HIGH
    evidence:
      - id: E002
        dimension: romance-structure
        tier: D
        access_mode: snippet
        supports: SUPPORT
        summary: "搜索引擎摘要截取某页面文案：'作品似乎为后宫'。无页面级证据。"
  expected:
    must:
      - "access_mode 保持 snippet（不得静默升级为 page）"
      - "romance-structure 不得判 CONFIRMED（至多 WEAK 线索 / UNKNOWN）"
      - "报告如实说明'仅有搜索摘要线索，无法核实'"
    must_not:
      - "harem = CONFIRMED"
      - "把摘要当页面证据输出确定结论"
  reason: source-policy §3.1~§3.2（摘要 ≠ 页面证据，只能 WEAK 线索）+ playbook §8.1 / §16。snippet 冒充 page 是 Critical Failure #3。

- id: EVID-003
  category: evidence-access
  critical: false
  description: 只有 search-result 标题且页面打不开 → 最多弱线索，不得直接分类
  request:
    prompt: "《长夜灯塔》后宫吗？"
  runtime:
    base_mode: SPECIFIC_RISK
    spoiler_level: none
    detail_level: normal
    preferences: null
    target: romance-structure
  research_state:
    identity:
      title: "长夜灯塔"
      author: "苏黎"
      confidence: HIGH
    evidence:
      - id: E003
        dimension: romance-structure
        tier: D
        access_mode: search-result
        supports: SUPPORT
        summary: "搜索结果只有标题'为什么《长夜灯塔》是年度第一后宫文？'，点击后页面 403 打不开。"
  expected:
    must:
      - "access_mode 保持 search-result（仅元数据 / 标题）"
      - "该条最多作为'引导下一步查询'的弱线索"
      - "最终结论不得直接据此分类（至多 WEAK / UNKNOWN）"
    must_not:
      - "以标题里的'后宫'二字直接判分类"
      - "把 search-result 当 page 证据"
  reason: playbook §8.1（search-result 主要用于导航）+ §6.2（搜索词命中 ≠ 分类成立）。

- id: EVID-004
  category: evidence-access
  critical: true
  description: A 原帖 + B 转载 + C 再转载 → 一个 independence group，不得“3 个独立来源”
  request:
    prompt: "《灰塔纪事》慢热吗？"
  runtime:
    base_mode: SPECIFIC_RISK
    spoiler_level: none
    detail_level: normal
    preferences: null
    target: slow-burn
  research_state:
    identity:
      title: "灰塔纪事"
      author: "林川"
      confidence: HIGH
    evidence:
      - id: E004
        dimension: slow-burn
        tier: C
        access_mode: page
        supports: SUPPORT
        summary: "知乎原帖长评：前期节奏慢。"
        independence_group: G1
      - id: E005
        dimension: slow-burn
        tier: C
        access_mode: page
        supports: SUPPORT
        summary: "某公众号文章转载知乎原帖全文。"
        independence_group: G1
      - id: E006
        dimension: slow-burn
        tier: D
        access_mode: page
        supports: SUPPORT
        summary: "贴吧帖子再次转载公众号内容。"
        independence_group: G1
  expected:
    must:
      - "三个证据归入同一个 independence group（G1），算一个来源链"
      - "不因 3 条记录而宣称'3 个独立来源'"
      - "agreement = INSUFFICIENT（独立来源不足），confidence 上限 WEAK"
    must_not:
      - "slow-burn = 高（CONFIRMED）"
      - "'多个来源一致'表述（实际只有一条来源链）"
  reason: source-policy §6 / playbook §9（转载按根来源合并计权；多个来源必须真正独立）。Critical Failure：同源链冒充独立性。

- id: EVID-005
  category: evidence-access
  critical: true
  description: SUPPORT + REFUTE + CONTEXT 同时存在 → Claim Synthesis 必须三者都考虑
  request:
    prompt: "《灰塔纪事》感情结构是什么？"
  runtime:
    base_mode: SPECIFIC_RISK
    spoiler_level: none
    detail_level: normal
    preferences: null
    target: romance-structure
  research_state:
    identity:
      title: "灰塔纪事"
      author: "林川"
      confidence: HIGH
    evidence:
      - id: E007
        dimension: romance-structure
        tier: C
        access_mode: page
        supports: SUPPORT
        summary: "读者长评：最终只有一个明确伴侣。"
      - id: E008
        dimension: romance-structure
        tier: C
        access_mode: page
        supports: REFUTE
        summary: "另一读者：'这书就是后宫'。"
      - id: E009
        dimension: romance-structure
        tier: C
        access_mode: page
        supports: CONTEXT
        summary: "书评：多名女性角色对主角有明显爱慕，但正文未确认主角回应。"
  expected:
    must:
      - "Claim Synthesis 同时纳入 SUPPORT / REFUTE / CONTEXT 三条"
      - "按 taxonomy 定义产出结论（如 single / multiple-ambiguous，含术语争议说明）"
    must_not:
      - "只保存 SUPPORT 证据而丢弃 REFUTE / CONTEXT"
      - "忽略 REFUTE 直接判 harem 或 single 的确定结论"
  reason: playbook §8.2（不要先形成结论后只收集支持性证据；重要争议应考虑正反证据）。

# ============================================================
# T605 — Claim → Dimension（4）
# ============================================================

- id: CD-001
  category: claim-dimension
  critical: true
  description: 三名女性喜欢主角但最终一个明确伴侣 → single + note，禁止 harem
  request:
    prompt: "《灰塔纪事》后宫吗？"
  runtime:
    base_mode: SPECIFIC_RISK
    spoiler_level: none
    detail_level: normal
    preferences: null
    target: romance-structure
  research_state:
    identity:
      title: "灰塔纪事"
      author: "林川"
      confidence: HIGH
    claims:
      - dimension: romance-structure
        summary: "三名女性角色对主角有明显好感，但作品最终明确只与一人确立伴侣关系，其余感情线未确认。"
        evidence_ids: [E007, E009]
  expected:
    must:
      - "romance-structure = single（H3 非后宫）"
      - "以 note 说明'存在多女暧昧 / 多人爱慕元素'"
    must_not:
      - "romance-structure = harem"
      - "harem = CONFIRMED"
  reason: taxonomy §3.2 / §3.3（H3：多个女性喜欢主角但主角只选一人 → 不判后宫）。多女暧昧误判 harem 是高频关键错误。

- id: CD-002
  category: claim-dimension
  critical: false
  description: 有属性面板但不发布任务、不决定成长路径 → system-intensity = light，禁止 heavy
  request:
    prompt: "《长夜灯塔》是重系统吗？"
  runtime:
    base_mode: SPECIFIC_RISK
    spoiler_level: none
    detail_level: normal
    preferences: null
    target: system-intensity
  research_state:
    identity:
      title: "长夜灯塔"
      author: "苏黎"
      confidence: HIGH
    claims:
      - dimension: system-intensity
        summary: "作品存在属性面板表现形式，但不发布任务、不决定成长路径，主线由角色与剧情推动。"
        evidence_ids: [E010]
  expected:
    must:
      - "system-intensity = light（存在但存在感低，仅偶尔辅助）"
      - "note 说明'有面板不等于系统流'"
    must_not:
      - "system-intensity = heavy"
      - "因为关键词'属性面板'直接判系统流"
  reason: taxonomy §5.1（有属性面板 ≠ heavy system；判断系统化机制对成长与剧情的控制程度）+ §9 边界速查。

- id: CD-003
  category: claim-dimension
  critical: false
  description: 主角两次失败并因此成长 → 禁止仅因此判 protagonist-abuse = heavy
  request:
    prompt: "《南岸往事》虐主吗？"
  runtime:
    base_mode: SPECIFIC_RISK
    spoiler_level: light
    detail_level: normal
    preferences: null
    target: protagonist-abuse
  research_state:
    identity:
      title: "南岸往事"
      author: "陈舟"
      confidence: HIGH
    claims:
      - dimension: protagonist-abuse
        summary: "主角经历两次明显失败，但每次失败都有明确原因、后续应对与成长收获，属于成长路径铺垫。"
        evidence_ids: [E011]
  expected:
    must:
      - "protagonist-abuse 不得 = heavy"
      - "判 none / light 并注明'属正常失败 / 成长挫折'"
