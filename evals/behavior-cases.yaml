# Novel Scout Behavior Cases（Stage 6）
#
# T601 — Case Schema（本文件字段规范）
#
# 每个 case 建议字段：
#   id:         案例 ID（如 RP-001）
#   category:   分类（request-parsing / identity / evidence-access / claim-dimension /
#               conflict-agreement / recency / preference / spoiler / stop-condition /
#               failure-degradation / report-ux）
#   critical:   true = 出现违反即 Stage 6 Gate FAIL（0 容忍）
#   description: 一句话描述该 case 验证什么
#   request:
#     prompt:   用户请求原文
#     context:  用户上下文（可选，含配置环境说明）
#   runtime:
#     base_mode:        FULL_SCAN / SPECIFIC_RISK / FIT_CHECK（预期解析结果）
#     spoiler_level:    none / light / full
#     detail_level:     normal / detailed
#     preferences:      偏好配置（或 null = 无配置）
#   research_state:
#     identity:         身份信息（title / author / confidence）
#     evidence:         预设证据笔记（tier / access_mode / supports / summary；仅测试夹具，不是 Runtime 强制结构）
#     claims:           预设 Claim（可选）
#     notes:            额外说明（可选）
#   expected:
#     must:             必须出现的行为清单
#     must_not:         禁止出现的行为清单
#     expected_dimensions: 预期 taxonomy 维度结果（value + confidence + agreement）
#     expected_recommendation: 预期最终建议（仅 FIT_CHECK / 有偏好时）
#   reason:             该 case 的设计理由与规则依据
#
# 原则：
#   - 测试 BEHAVIOR，不测试模型知识：所有小说为虚构，所有事实在 research_state 中给定。
#   - NO REAL WEB REQUIRED：默认不发起真实搜索；若执行时意外发起真实搜索 = 测试失败信号。
#   - 允许省略不必要的字段，保持 YAML 可读。

cases:

# ============================================================
# T602 — Request Parsing（4）
# ============================================================

- id: RP-001
  category: request-parsing
  critical: false
  description: 无修饰请求“排雷”解析为 FULL_SCAN + 默认 modifiers
  request:
    prompt: "排雷《灰塔纪事》"
  runtime:
    base_mode: FULL_SCAN
    spoiler_level: light
    detail_level: normal
    preferences: null
  research_state:
    identity:
      title: "灰塔纪事"
      author: "林川"
      confidence: HIGH
  expected:
    must:
      - "base_mode = FULL_SCAN"
      - "spoiler_level = light（默认）"
      - "detail_level = normal（默认）"
    must_not:
      - "解析为 SPECIFIC_RISK 或 FIT_CHECK"
  reason: 验证 SKILL.md Modes / Core Workflow Parse + search-playbook §1~§2 的默认解析。“排雷《X》”是 FULL_SCAN 原型请求。

- id: RP-002
  category: request-parsing
  critical: false
  description: “无剧透 + 单一雷点”解析为 SPECIFIC_RISK + none
  request:
    prompt: "无剧透看看《灰塔纪事》有没有后宫"
  runtime:
    base_mode: SPECIFIC_RISK
    spoiler_level: none
    detail_level: normal
    preferences: null
    target: romance-structure
  research_state:
    identity:
      title: "灰塔纪事"
      author: "林川"
      confidence: HIGH
  expected:
    must:
      - "base_mode = SPECIFIC_RISK"
      - "target = romance-structure（后宫是派生标签，落到感情结构维度）"
      - "spoiler_level = none"
      - "detail_level = normal"
    must_not:
      - "解析为 FULL_SCAN"
      - "调查范围扩大到 16 CORE"
  reason: search-playbook §1~§2 定义 SPECIFIC_RISK 与请求修饰；report-format §7 定义 none 剧透输出边界。

- id: RP-003
  category: request-parsing
  critical: false
  description: “适不适合我 + 详细 + 完全剧透”解析为 FIT_CHECK + full + detailed
  request:
    prompt: "详细看看《灰塔纪事》适不适合我，可以完全剧透"
  runtime:
    base_mode: FIT_CHECK
    spoiler_level: full
    detail_level: detailed
    preferences: null
  research_state:
    identity:
      title: "灰塔纪事"
      author: "林川"
      confidence: HIGH
  expected:
    must:
      - "base_mode = FIT_CHECK（适不适合我）"
      - "spoiler_level = full（可以完全剧透 = 显式允许）"
      - "detail_level = detailed（详细）"
    must_not:
      - "spoiler_level 停在默认 light"
  reason: 验证“适不适合我”+ 显式剧透升级 + 详细程度的组合解析（report-format §7：用户当场说“可以剧透”视为升级）。

- id: RP-004
  category: request-parsing
  critical: false
  description: 当前请求覆盖配置文件中的 spoiler_level，且不写回配置
  request:
    prompt: "这次完全不要剧透。"
    context: "用户配置文件 spoiler_level = light；本次为同一本书排雷的后续请求。"
  runtime:
    base_mode: FULL_SCAN
    spoiler_level: none
    detail_level: normal
    preferences:
      spoiler_level: light
  research_state:
    identity:
      title: "灰塔纪事"
      author: "林川"
      confidence: HIGH
  expected:
    must:
      - "本次 spoiler_level = none（当前请求覆盖配置）"
      - "报告头部标注无剧透"
      - "用户配置文件保持 light 不变（不写回）"
    must_not:
      - "悄悄沿用配置的 light"
      - "修改 config/preferences.yaml"
  reason: SKILL.md STEP 1 明确“当前请求覆盖配置……不修改用户配置文件”。

# ============================================================
# T603 — Identity Resolution（5）
# ============================================================

- id: IDENTITY-001
  category: identity
  critical: false
  description: 单一明确候选 → HIGH，继续研究
  request:
    prompt: "排雷《长夜灯塔》"
  runtime:
    base_mode: FULL_SCAN
    spoiler_level: light
    detail_level: normal
    preferences: null
  research_state:
    identity:
      title: "长夜灯塔"
      author: "苏黎"
      confidence: HIGH
    notes: "全网只有一个明显主流候选，作者一致。"
  expected:
    must:
      - "identity = HIGH"
      - "继续进入研究计划，不询问用户消歧"
    must_not:
      - "因同名焦虑无限加查"
  reason: search-playbook §4（书名 + 作者信息足以达到 HIGH 身份置信度时可继续）；验证正常路径不被打断。

- id: IDENTITY-002
  category: identity
  critical: true
  description: 同名两本《星河》，用户未给作者 → 必须请求消歧，禁止混合调查
  request:
    prompt: "排雷《星河》"
    context: "《星河》存在两本：作者李青 / 作者陈舟，均为热门小说，用户未提供作者。"
  runtime:
    base_mode: FULL_SCAN
    spoiler_level: light
    detail_level: normal
    preferences: null
  research_state:
    identity:
      title: "星河"
      candidates:
        - "作者：李青（A 版）"
        - "作者：陈舟（B 版）"
      confidence: LOW
  expected:
    must:
      - "列出候选（1. 李青版 / 2. 陈舟版）并询问用户"
      - "两版的 evidence 严格隔离"
    must_not:
      - "把李青版的后宫结论用到陈舟版（或反之）"
      - "自动选择搜索排名第一的那本"
      - "进入正式排雷结论"
  reason: SKILL.md Core Workflow Identity + playbook §4：身份 LOW 时先询问用户，不得混合不同同名小说资料。混合 evidence 是 Critical Failure #1。

- id: IDENTITY-003
  category: identity
  critical: false
  description: 用户给出作者 → 自动消歧选择对应版本
  request:
    prompt: "排雷李青写的《星河》"
  runtime:
    base_mode: FULL_SCAN
    spoiler_level: light
    detail_level: normal
    preferences: null
  research_state:
    identity:
      title: "星河"
      author: "李青"
      candidates:
        - "作者：李青（A 版）"
        - "作者：陈舟（B 版）"
      confidence: HIGH
  expected:
    must:
      - "identity = HIGH，自动选择李青版"
      - "使用李青版的 evidence 进行排雷"
    must_not:
      - "继续询问用户"
      - "混入陈舟版 evidence"
  reason: playbook §4（使用用户提供的作者 / 平台提示进行身份消歧）。

- id: IDENTITY-004
  category: identity
  critical: false
  description: 书名匹配但作者/平台证据冲突 → MEDIUM/LOW，不得正式输出强排雷结论
  request:
    prompt: "排雷《雾都旧事》"
  runtime:
    base_mode: FULL_SCAN
    spoiler_level: light
    detail_level: normal
    preferences: null
  research_state:
    identity:
      title: "雾都旧事"
      confidence: LOW
    notes: "书名一致，但不同来源给出的作者与平台互相冲突，无法确认是哪一本。"
  expected:
    must:
      - "identity = LOW（或 MEDIUM 且标记重大可辨性风险）"
      - "先消歧或询问，不输出强排雷结论"
    must_not:
      - "以 LOW identity 进入正式排雷并给确定结论"
      - "混合冲突候选的证据"
  reason: playbook §4 / §16（身份 LOW 时先消歧，不得进入正式排雷结论）。避免“身份不明强下结论”。

- id: IDENTITY-005
  category: identity
  critical: true
  description: 模型先验认为作者 A，evidence 明确作者 B → evidence wins
  request:
    prompt: "排雷《南岸往事》"
  runtime:
    base_mode: FULL_SCAN
    spoiler_level: light
    detail_level: normal
    preferences: null
  research_state:
    identity:
      title: "南岸往事"
      author: "陈舟"
      confidence: HIGH
    notes: "模型记忆先验倾向作者 A（记忆中的印象），但检索到的官方作品页明确作者为陈舟（Tier A / page）。"
  expected:
    must:
      - "identity = 陈舟（以 Tier A evidence 为准）"
      - "报告使用陈舟版的信息"
    must_not:
      - "以模型记忆覆盖 evidence"
      - "先入为主按作者 A 搜索支持性信息"
  reason: SKILL.md STEP 2 “Model memory is not evidence”；Critical Failure #2（模型记忆覆盖 evidence）。

# ============================================================
